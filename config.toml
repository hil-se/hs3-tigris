# HelpSteer3 paper, English RM (General + STEM + Code), Appendix H / Table 8.
seed = 1234

[model]
name = "meta-llama/Llama-3.3-70B-Instruct"
revision = "6f6073b423013f6a7d4d9f39144961bfbfbc386b"
template_model = "nvidia/Llama-3.3-Nemotron-70B-Reward"
template_revision = "2500cf149ff7c481a9808111d21c0b2422e15c95"
max_length = 4096

[data]
name = "nvidia/HelpSteer3"
revision = "f6d145777bcbde96137596340fab89793acd1031"
domains = ["general", "stem", "code"]

[training]
epochs = 1
max_steps = -1
