global_batch_pairs = 64
micro_batch_pairs = 1
learning_rate = 0.000002
warmup_steps = 10
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.98
max_grad_norm = 1.0
eval_steps = 50
